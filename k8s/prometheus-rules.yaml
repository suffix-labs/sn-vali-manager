apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
data:
  alerts.yml: |
    groups:
      - name: validator_alerts
        rules:
          - alert: SuffixValidatorDown
            expr: up{job="suffix-validator"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Suffix Validator is down"
              description: "Suffix validator has been unreachable for more than 2 minutes."

          - alert: EthchiValidatorDown
            expr: up{job="ethchi-validator"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Ethchi Validator is down"
              description: "Ethchi validator has been unreachable for more than 2 minutes."

          - alert: SuffixValidatorLowBalance
            expr: validator_attestation_operational_account_balance_strk{job="suffix-validator"} < 50
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Suffix Validator low STRK balance"
              description: "Suffix validator operational account has only {{ $value | printf \"%.2f\" }} STRK remaining. Please top up to avoid signing failures."

          - alert: EthchiValidatorLowBalance
            expr: validator_attestation_operational_account_balance_strk{job="ethchi-validator"} < 50
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Ethchi Validator low STRK balance"
              description: "Ethchi validator operational account has only {{ $value | printf \"%.2f\" }} STRK remaining. Please top up to avoid signing failures."

          - alert: SuffixValidatorCriticalBalance
            expr: validator_attestation_operational_account_balance_strk{job="suffix-validator"} < 10
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Suffix Validator critically low STRK balance"
              description: "URGENT: Suffix validator has only {{ $value | printf \"%.2f\" }} STRK. Attestations will fail imminently!"

          - alert: EthchiValidatorCriticalBalance
            expr: validator_attestation_operational_account_balance_strk{job="ethchi-validator"} < 10
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Ethchi Validator critically low STRK balance"
              description: "URGENT: Ethchi validator has only {{ $value | printf \"%.2f\" }} STRK. Attestations will fail imminently!"

          - alert: SuffixValidatorAttestationFailures
            expr: increase(validator_attestation_attestation_failure_count{job="suffix-validator"}[15m]) > 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Suffix Validator attestation failures detected"
              description: "Suffix validator has had {{ $value | printf \"%.0f\" }} attestation failure(s) in the last 15 minutes. Check balance and node connectivity."

          - alert: EthchiValidatorAttestationFailures
            expr: increase(validator_attestation_attestation_failure_count{job="ethchi-validator"}[15m]) > 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Ethchi Validator attestation failures detected"
              description: "Ethchi validator has had {{ $value | printf \"%.0f\" }} attestation failure(s) in the last 15 minutes. Check balance and node connectivity."

          - alert: SuffixValidatorMissedEpochs
            expr: increase(validator_attestation_missed_epochs_count{job="suffix-validator"}[1h]) > 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Suffix Validator missed epoch attestations"
              description: "Suffix validator has missed {{ $value | printf \"%.0f\" }} epoch(s) in the last hour. This affects staking rewards!"

          - alert: EthchiValidatorMissedEpochs
            expr: increase(validator_attestation_missed_epochs_count{job="ethchi-validator"}[1h]) > 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Ethchi Validator missed epoch attestations"
              description: "Ethchi validator has missed {{ $value | printf \"%.0f\" }} epoch(s) in the last hour. This affects staking rewards!"

      - name: pathfinder_alerts
        rules:
          - alert: PathfinderDown
            expr: up{job="pathfinder"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Pathfinder node is down"
              description: "Pathfinder StarkNet node has been unreachable for more than 2 minutes."

          - alert: PathfinderSyncLag
            expr: (highest_block{job="pathfinder"} - current_block{job="pathfinder"}) > 100
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Pathfinder sync lag detected"
              description: "Pathfinder is {{ $value }} blocks behind. Node may be having sync issues."

          - alert: PathfinderSlowProcessing
            expr: block_processing{job="pathfinder"} > 15
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pathfinder block processing slow"
              description: "Block processing time is {{ $value }}s (threshold: 15s)."

          - alert: PathfinderSlowDownload
            expr: block_download{job="pathfinder"} > 30
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pathfinder block download slow"
              description: "Block download time is {{ $value }}s (threshold: 30s)."

