apiVersion: batch/v1
kind: CronJob
metadata:
  name: telegram-daily-summary
  labels:
    app: telegram-daily-summary
spec:
  schedule: "0 13 * * *"  # 8:00 AM Eastern (13:00 UTC)
  timeZone: "America/New_York"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
          # Fetch staking data using the pre-built image
          - name: get-staking-data
            image: ghcr.io/trbiv/sn-vali-manager/staking-reporter:latest  # UPDATE with your actual repo
            command: ["node", "get-staking-data.mjs"]
            volumeMounts:
            - name: staking-data
              mountPath: /data
            env:
            - name: OUTPUT_FILE
              value: /data/staking.json
          containers:
          - name: daily-summary
            image: alpine:latest
            command: ["/bin/sh", "-c"]
            args:
              - |
                apk add --no-cache curl jq > /dev/null 2>&1

                PROMETHEUS_URL="http://prometheus-service:9090"
                BOT_TOKEN=$(cat /etc/telegram/bot-token)
                CHAT_ID=$(cat /etc/telegram/chat-id)
                DATE=$(date +"%b %d, %Y")

                # Read staking data from init container
                STAKING_DATA=$(cat /data/staking.json 2>/dev/null || echo '{}')

                # Parse staking data
                SUFFIX_REWARDS=$(echo "$STAKING_DATA" | jq -r '.Suffix.unclaimed // "N/A"')
                SUFFIX_STRK_BAL=$(echo "$STAKING_DATA" | jq -r '.Suffix.strk // "N/A"')
                SUFFIX_ETH_BAL=$(echo "$STAKING_DATA" | jq -r '.Suffix.eth // "N/A"')
                ETHCHI_REWARDS=$(echo "$STAKING_DATA" | jq -r '.Ethchi.unclaimed // "N/A"')
                ETHCHI_STRK_BAL=$(echo "$STAKING_DATA" | jq -r '.Ethchi.strk // "N/A"')
                ETHCHI_ETH_BAL=$(echo "$STAKING_DATA" | jq -r '.Ethchi.eth // "N/A"')

                # Query Prometheus
                query() {
                  curl -s -G "${PROMETHEUS_URL}/api/v1/query" --data-urlencode "query=$1" | jq -r '.data.result[0].value[1] // "N/A"'
                }

                # Get metrics
                CURRENT_BLOCK=$(query 'current_block')
                HIGHEST_BLOCK=$(query 'highest_block')
                if [ "$CURRENT_BLOCK" != "N/A" ] && [ "$HIGHEST_BLOCK" != "N/A" ]; then
                  SYNC_LAG=$((${HIGHEST_BLOCK%.*} - ${CURRENT_BLOCK%.*}))
                else
                  SYNC_LAG="N/A"
                fi

                SUFFIX_UP=$(query 'up{job="suffix-validator"}')
                ETHCHI_UP=$(query 'up{job="ethchi-validator"}')
                PATHFINDER_UP=$(query 'up{job="pathfinder"}')

                # 24h uptime calculation
                SUFFIX_UPTIME=$(query 'avg_over_time(up{job="suffix-validator"}[24h]) * 100')
                ETHCHI_UPTIME=$(query 'avg_over_time(up{job="ethchi-validator"}[24h]) * 100')

                # Performance metrics
                BLOCK_PROCESSING=$(query 'avg_over_time(block_processing[24h])')
                BLOCK_DOWNLOAD=$(query 'avg_over_time(block_download[24h])')
                PATHFINDER_CPU=$(query 'rate(process_cpu_seconds_total{job="pathfinder"}[24h]) * 100')

                # Count alerts
                ALERTS_COUNT=$(curl -s -G "${PROMETHEUS_URL}/api/v1/query" --data-urlencode 'query=count(ALERTS{alertstate="firing"})' | jq -r '.data.result[0].value[1] // "0"')

                # Format helpers
                format_status() { [ "$1" = "1" ] && echo "✅" || echo "❌"; }
                format_sync() {
                  [ "$1" = "N/A" ] && echo "⚠️ Unknown" && return
                  [ "$1" -le 5 ] && echo "✅ Synced" && return
                  [ "$1" -le 100 ] && echo "⚠️ Catching up" && return
                  echo "❌ Behind"
                }
                format_number() { [ "$1" = "N/A" ] && echo "N/A" || printf "%.1f" "$1" 2>/dev/null || echo "$1"; }
                format_percent() { [ "$1" = "N/A" ] && echo "N/A" || printf "%.0f%%" "$1" 2>/dev/null || echo "$1"; }

                SYNC_STATUS=$(format_sync "$SYNC_LAG")

                # Build message
                MESSAGE="📊 <b>StarkNet Daily Report - ${DATE}</b>

                🔗 <b>Node Sync:</b> ${SYNC_STATUS}
                   Block: ${CURRENT_BLOCK%.*} / ${HIGHEST_BLOCK%.*} (lag: ${SYNC_LAG})

                <b>Services:</b>
                $(format_status "$PATHFINDER_UP") Pathfinder
                $(format_status "$SUFFIX_UP") Suffix Validator ($(format_percent "$SUFFIX_UPTIME") uptime 24h)
                $(format_status "$ETHCHI_UP") Ethchi Validator ($(format_percent "$ETHCHI_UPTIME") uptime 24h)

                💰 <b>Staking Rewards:</b>
                   Suffix: ${SUFFIX_REWARDS} STRK unclaimed
                   Ethchi: ${ETHCHI_REWARDS} STRK unclaimed

                🏦 <b>Operational Balances:</b>
                   Suffix: ${SUFFIX_STRK_BAL} STRK / ${SUFFIX_ETH_BAL} ETH
                   Ethchi: ${ETHCHI_STRK_BAL} STRK / ${ETHCHI_ETH_BAL} ETH

                ⚡ <b>Performance (24h avg):</b>
                   Block processing: $(format_number "$BLOCK_PROCESSING")s
                   Block download: $(format_number "$BLOCK_DOWNLOAD")s

                💻 <b>Resources:</b>
                   Pathfinder CPU: $(format_percent "$PATHFINDER_CPU")

                🔔 Active alerts: ${ALERTS_COUNT}"

                # Send to Telegram
                curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                  -d "chat_id=${CHAT_ID}" \
                  -d "parse_mode=HTML" \
                  -d "text=${MESSAGE}" > /dev/null

                echo "Daily summary sent to Telegram"
            volumeMounts:
            - name: telegram-secrets
              mountPath: /etc/telegram
              readOnly: true
            - name: staking-data
              mountPath: /data
              readOnly: true
            resources:
              requests:
                memory: "32Mi"
                cpu: "10m"
              limits:
                memory: "64Mi"
                cpu: "100m"
          volumes:
          - name: telegram-secrets
            secret:
              secretName: telegram-secrets
          - name: staking-data
            emptyDir: {}
