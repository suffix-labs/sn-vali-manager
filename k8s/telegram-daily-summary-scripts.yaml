apiVersion: v1
kind: ConfigMap
metadata:
  name: daily-summary-scripts
data:
  get-staking-data.js: |
    const https = require("https");

    const RPC = process.env.STARKNET_RPC || "https://starknet-mainnet.g.alchemy.com/starknet/version/rpc/v0_7/demo";
    const STAKING = "0x00ca1702e64c81d9a07b86bd2c540188d92a2c73cf5cc0e508d949015e7e84a7";
    const STRK = "0x04718f5a0fc34cc1af16a1cdee98ffb20c31f5cd61d6ab07201858f4287c938d";
    const ETH = "0x049d36570d4e46f48e99674bd3fcc84644ddd6b96f7c741b1562b82f9e004dc7";

    // Selectors (pre-computed starknet_keccak)
    const STAKER_INFO_V1_SELECTOR = "0x00c5a437a24a847601c4dcab9247c82ccb34cdfa60be89842f01b91d6fd822d8";
    const BALANCE_OF_SELECTOR = "0x02e4263afad30923c891518314c3c95dbe830a16874e8abc5777a9a20b54c76e";

    const VALIDATORS = [
      {
        name: "Suffix",
        staker: "0x02dc260794e4c2eeae87b1403a88385a72c18a5844d220b88117b2965a8cf3a5",
        operational: "0x073c1316211c70bb44f6976515d0db7b408d99f4adcfd14ca3a0a044a48e1a21"
      },
      {
        name: "Ethchi",
        staker: "0x0223d82a4ea1c98b163a4c7b9921202613f2b335292216e215a9a03d20fea2b2",
        operational: "0x07912a3ee4a22c70fc7e0a093e885545872741f64b9992bbb2530321ef5fcad6"
      }
    ];

    function rpcCall(method, params) {
      return new Promise((resolve, reject) => {
        const data = JSON.stringify({ jsonrpc: "2.0", method, params, id: 1 });
        const url = new URL(RPC);
        const req = https.request({
          hostname: url.hostname,
          path: url.pathname,
          method: "POST",
          headers: { "Content-Type": "application/json" }
        }, res => {
          let body = "";
          res.on("data", chunk => body += chunk);
          res.on("end", () => {
            try {
              const parsed = JSON.parse(body);
              if (parsed.error) reject(new Error(parsed.error.message));
              else resolve(parsed.result);
            } catch(e) {
              reject(e);
            }
          });
        });
        req.on("error", reject);
        req.write(data);
        req.end();
      });
    }

    function starknetCall(contract, selector, calldata) {
      return rpcCall("starknet_call", {
        request: { contract_address: contract, entry_point_selector: selector, calldata },
        block_id: "latest"
      });
    }

    function hexToStrk(hex) {
      if (!hex || hex === "0x0") return "0.00";
      return (Number(BigInt(hex)) / 1e18).toFixed(2);
    }

    async function getValidatorData(validator) {
      // Get staker info
      const info = await starknetCall(STAKING, STAKER_INFO_V1_SELECTOR, [validator.staker]);

      // Parse staker_info_v1 response:
      // [0] reward_address
      // [1] operational_address
      // [2] unstake_time variant (0=None, 1=Some)
      // [3] unstake_time value (if Some) or amount_own (if None)
      // [4] amount_own (if Some) or unclaimed_rewards_own (if None)
      // [5] unclaimed_rewards_own (if Some)
      const hasUnstakeTime = info[2] !== "0x0";
      const amountOwnIdx = hasUnstakeTime ? 4 : 3;
      const unclaimedIdx = hasUnstakeTime ? 5 : 4;

      const unclaimed = info[unclaimedIdx] || "0x0";
      const staked = info[amountOwnIdx] || "0x0";

      // Get operational address balances
      const strkBal = await starknetCall(STRK, BALANCE_OF_SELECTOR, [validator.operational]);
      const ethBal = await starknetCall(ETH, BALANCE_OF_SELECTOR, [validator.operational]);

      return {
        unclaimed: hexToStrk(unclaimed),
        staked: hexToStrk(staked),
        strk: hexToStrk(strkBal?.[0]),
        eth: hexToStrk(ethBal?.[0])
      };
    }

    async function main() {
      const results = {};

      for (const v of VALIDATORS) {
        try {
          results[v.name] = await getValidatorData(v);
        } catch (e) {
          results[v.name] = { error: e.message };
        }
      }

      console.log(JSON.stringify(results));
    }

    main().catch(e => {
      console.error(JSON.stringify({ error: e.message }));
      process.exit(1);
    });
