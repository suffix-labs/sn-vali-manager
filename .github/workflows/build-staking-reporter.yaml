name: Build Staking Reporter Image

on:
  push:
    branches: [main]
    paths:
      - 'scripts/claim-rewards/get-staking-data.mjs'
      - 'scripts/claim-rewards/staking-abi.json'
      - 'scripts/claim-rewards/package.json'
      - 'scripts/claim-rewards/package-lock.json'
      - 'scripts/claim-rewards/Dockerfile'
      - '.github/workflows/build-staking-reporter.yaml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/staking-reporter

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: scripts/claim-rewards
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
